name: TaskPilot E2E System Regression

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Sync to Hugging Face Hub"]
    types: [completed]
    branches: [main]

jobs:
  e2e-regression:
    name: Playwright System-Wide E2E Tests
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout E2E Test Suite
        uses: actions/checkout@v4
        with:
          repository: taskpilot-platform/taskpilot-e2e
          ref: main
          path: taskpilot-e2e

      - name: Wait for Hugging Face Backend Readiness
        run: |
          echo "Waiting for Hugging Face backend to be healthy..."
          for i in {1..40}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://taskpilot952476-taskpilot.hf.space/actuator/health || true)
            echo "Attempt $i: /actuator/health returned HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "Backend is UP and healthy!"
              break
            fi
            sleep 15
          done

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'taskpilot-e2e/package-lock.json'

      - name: Install E2E Dependencies
        working-directory: ./taskpilot-e2e
        run: npm ci

      - name: Install Playwright Browsers
        working-directory: ./taskpilot-e2e
        run: npx playwright install --with-deps chromium

      - name: Execute Full System Regression Suite
        working-directory: ./taskpilot-e2e
        env:
          E2E_TARGET: staging
          E2E_API_URL: https://taskpilot952476-taskpilot.hf.space/api
          E2E_BASE_URL: https://taskpilot-platform.netlify.app
          E2E_WS_URL: wss://taskpilot952476-taskpilot.hf.space/ws/chat
          E2E_ALLOW_REMOTE_DB: '1'
          E2E_DB_HOST: ${{ secrets.E2E_DB_HOST }}
          E2E_DB_PORT: ${{ secrets.E2E_DB_PORT }}
          E2E_DB_NAME: ${{ secrets.E2E_DB_NAME }}
          E2E_DB_USER: ${{ secrets.E2E_DB_USER }}
          E2E_DB_PASSWORD: ${{ secrets.E2E_DB_PASSWORD }}
          E2E_DB_SSL: 'true'
          CI: true
        run: npx playwright test --reporter=list,html

      - name: Upload Test Report & Traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: taskpilot-e2e/playwright-report/
          retention-days: 14
