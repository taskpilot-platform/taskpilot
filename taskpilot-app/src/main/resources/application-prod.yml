server:
  port: ${PORT:${SERVER_PORT:7860}}
  forward-headers-strategy: none

spring:
  config:
    activate:
      on-profile: prod

  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: ${HIBERNATE_DDL_AUTO:validate}
    show-sql: false

  flyway:
    fail-on-missing-locations: true

application:
  security:
    jwt:
      blocklist:
        provider: ${JWT_BLOCKLIST_PROVIDER:redis}
    oauth2:
      success-redirect-uri: ${OAUTH2_SUCCESS_REDIRECT_URI:https://taskpilot-platform.netlify.app/auth/callback}
      allowed-redirect-origins: ${OAUTH2_ALLOWED_REDIRECT_ORIGINS:https://taskpilot-platform.netlify.app}
      cookie-secure: ${OAUTH2_COOKIE_SECURE:true}

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: when-authorized
      roles: ADMIN
  health:
    mail:
      enabled: false
    redis:
      enabled: false

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://taskpilot-platform.netlify.app}

egress:
  validate-on-startup: ${EGRESS_VALIDATE_ON_STARTUP:true}

