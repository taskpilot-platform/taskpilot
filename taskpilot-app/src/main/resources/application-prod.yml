server:
  port: ${PORT:${SERVER_PORT:7860}}

spring:
  config:
    activate:
      on-profile: prod

  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    fail-on-missing-locations: true

application:
  security:
    jwt:
      blocklist:
        provider: ${JWT_BLOCKLIST_PROVIDER:redis}

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: when-authorized
      roles: ADMIN
  health:
    mail:
      enabled: false

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://taskpilot-platform.netlify.app}

