server:
  port: 8080
  address: ${DEV_SERVER_ADDRESS:127.0.0.1}

spring:
  config:
    activate:
      on-profile: dev

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        format-sql: true

  flyway:
    fail-on-missing-locations: false

logging:
  level:
    org.springframework.security: INFO
    com.taskpilot: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

application:
  security:
    jwt:
      secret-key: ${JWT_SECRET:taskpilot-dev-only-local-loopback-jwt-signing-key-2026-01}
    oauth2:
      cookie-secure: false

app:
  cors:
    allowed-origins: http://localhost:5173,http://127.0.0.1:5173

